# Machine-readable catalogue of the Python SDK examples (nativehtmlkit 0.1.2).
# `id` is the parity key shared with the PowerShell SDK; `file` is relative to examples/.
# tests/integration/test_examples.py starts every entry against the real host and
# tests/integration/test_example_behaviour.py runs one read-back check per entry; both fail when an
# entry, a file or a check is missing.

[[example]]
id = "hello"
title = "Hello"
summary = "The smallest complete app: a greeting form that writes untrusted text safely."
teaches = ["application lifecycle", "get_value", "set_text"]
file = "hello.py"
run = "uv run hello.py"
guide = "lifecycle"
language_specific = false

